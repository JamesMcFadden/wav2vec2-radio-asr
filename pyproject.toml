[project]
name = "asr"
version = "0.1.0"
description = "Fine-tuning Wav2Vec2.0 for CTC speech recognition on radio-channel ATC audio, validated against LibriSpeech"
readme = "README.md"
authors = [
    { name = "James McFadden", email = "65996172+JamesMcFadden@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "jiwer>=4.0.0",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "transformers>=5.14.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test downloads from the HuggingFace Hub (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
